<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>

    <link rel="icon"  type="image/.ico" href="../Projeto-login/imagens/favicon-16x16.png">

    <body>
        <img src="imagens/predioschiques.jpg" class="fundo" alt="arranhacel">



        <script>
  const arranhacel = document.querySelector(".fundo");

  function atualizarImagem() {
    if (window.matchMedia("(max-width: 1024px)").matches) {
      arranhacel.src = "imagens/predioschiques.jpg";
    } else if (window.matchMedia("(min-width: 1025px)").matches) {
      arranhacel.src = "imagens/arranhacel.jpg";
    }
  }

  atualizarImagem();
  window.addEventListener("resize", atualizarImagem);
        </script>

   



  

            <section id="login">

                <div id="imagem">

                </div>

                <div id="formulario">
                    

                    <form action="login.php" method="post" autocomplete="on">

                            <h1>Seja bem-vindo (a). Faça o login para acessar sua conta.</h1>

                            <label for="usuario">Usuário:</label>
                            <input type="text"  id="usuario" placeholder="Digite seu usuário" required>

                            <label for="senha">Senha:</label>
                           <input type="password" id="senha" placeholder="Digite sua senha" required>
                        <div>
                            <button type="submit">Entrar</button>
                            <a href="esqueceu.html">Esqueceu a senha?</a>
                        </div>    
                    </form>

                </div>

            </section>
    </body>
</html>
